[project]
name = "daycraft-ai"
version = "1.0.0"
description = "A privacy-conscious, AI-assisted personal productivity workspace."
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["venv", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
